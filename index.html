<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 40px; background: #f4f4f9; }
    form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    div { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background: #6c757d; }
    #status { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <form id="contactForm">
    <h2>Contact Us</h2>
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" required />
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" required />
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" rows="4" required></textarea>
    </div>
    <button type="submit" id="submitBtn">Send Message</button>
    <div id="status"></div>
  </form>

  <script>
    const form = document.getElementById('contactForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = 'Sending...';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        message: document.getElementById('message').value,
        eventId: 'lead_' + Date.now()
      };

      try {
        const response = await fetch('https://form-backend-5tq6.onrender.com/submit-form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.response ? await response.json() : await response.json();

        if (response.ok && data.success) {
          statusDiv.style.color = 'green';
          statusDiv.textContent = 'Message sent successfully!';
          form.reset();
        } else {
          throw new Error(data.message || 'Server error');
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Error sending message. Please try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
